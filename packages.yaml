# Package catalogue for go.toshicloud.io; build.mjs validates it and emits .generated/catalogue.json.
url: go.toshicloud.io
packages:
  cubby:
    repo: github.com/toshicloud/cubby
    description: A local cache for GitHub Actions, available as a Go library and server.
  toshi:
    repo: github.com/toshicloud/toshi-go
    description: Go SDK for Toshi, generated from the core API.
  api:
    repo: github.com/toshicloud/toshi-api
    description: "The Toshi API: protocol definitions and generated clients for the workspace, operator and GitHub services"
